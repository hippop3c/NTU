function routeColor(type){return type==='existing'?'#2563eb':'#f97316'}
function drawRoutes(){routeLayers.forEach(l=>map.removeLayer(l));routeLayers=[];routes.forEach(r=>{const points=r.codes.map(c=>stationByCode[c]).filter(Boolean).map(s=>[s.lat,s.lng]);if(points.length<2)return;const color=routeColor(r.type),line=L.polyline(points,{color,weight:4,opacity:.82,dashArray:r.type==='planned'?'9,7':null}).addTo(map);line.bindPopup(`<b>${r.name}</b><br>${r.type==='existing'?'既有調度路線':'預計新增路線'}｜${r.period}`);routeLayers.push(line);try{const deco=L.polylineDecorator(line,{patterns:[{offset:'58%',repeat:0,symbol:L.Symbol.arrowHead({pixelSize:10,polygon:false,pathOptions:{stroke:true,color,weight:3}})}]}).addTo(map);routeLayers.push(deco)}catch(e){}})}
function renderRoutes(){const box=document.getElementById('routeList');box.innerHTML='';if(!routes.length){box.innerHTML='<div class="empty">尚無路線</div>';drawRoutes();return}routes.forEach((r,i)=>{const names=r.codes.map(c=>stationByCode[c]?.name||c);box.insertAdjacentHTML('beforeend',`<div class="route-item" style="--route-color:${routeColor(r.type)}"><div class="route-head"><span class="route-title">${r.name}</span><span class="badge ${r.type}">${r.type==='existing'?'既有':'預計新增'}</span></div><div class="route-meta">${r.period}｜${names.length} 站</div><div class="route-path">${names.join(' → ')}</div><div class="route-actions"><button onclick="focusRoute(${i})">定位</button><button onclick="editRoute(${i})">編輯</button><button class="danger" onclick="deleteRoute(${i})">刪除</button></div></div>`)});drawRoutes()}
function focusRoute(i){const pts=routes[i].codes.map(c=>stationByCode[c]).filter(Boolean).map(s=>[s.lat,s.lng]);if(pts.length)map.fitBounds(L.latLngBounds(pts).pad(.25))}function editRoute(i){const r=routes[i];editingIndex=i;draft=[...r.codes];document.getElementById('routeName').value=r.name;document.getElementById('routeType').value=r.type;document.getElementById('routePeriod').value=['上午','下午','晚上','全天','自訂'].includes(r.period)?r.period:'自訂';document.getElementById('saveRoute').textContent='更新路線';renderDraft()}function deleteRoute(i){if(!confirm(`刪除「${routes[i].name}」？`))return;routes.splice(i,1);if(editingIndex===i)resetDraft();else if(editingIndex!==null&&editingIndex>i)editingIndex--;persist();renderRoutes()}window.focusRoute=focusRoute;window.editRoute=editRoute;window.deleteRoute=deleteRoute;
function resetDraft(){draft=[];editingIndex=null;document.getElementById('routeName').value='';document.getElementById('saveRoute').textContent='儲存路線';renderDraft()}
document.getElementById('saveRoute').onclick=()=>{if(draft.length<2){alert('請至少選擇 2 個點位');return}const name=document.getElementById('routeName').value.trim()||draft.map(c=>stationByCode[c].name).join(' → '),record={id:editingIndex===null?'r'+Date.now():routes[editingIndex].id,name,type:document.getElementById('routeType').value,period:document.getElementById('routePeriod').value,codes:[...draft]};if(editingIndex===null)routes.push(record);else routes[editingIndex]=record;persist();resetDraft();renderRoutes()};
document.getElementById('clearDraft').onclick=resetDraft;
function renderStations(){const q=document.getElementById('stationSearch').value.trim().toLowerCase(),area=document.getElementById('areaFilter').value,box=document.getElementById('stationList');const filtered=stations.filter(s=>(area==='all'||s.area===area)&&(!q||s.name.toLowerCase().includes(q)||s.code.includes(q)));box.innerHTML='';filtered.forEach(s=>box.insertAdjacentHTML('beforeend',`<div class="station-row"><button onclick="addStation('${s.code}')" title="加入路線" style="padding:2px 5px">＋</button><span>${s.name}<small>${s.code}｜${s.docks} 車位</small></span><span class="area-tag ${s.area==='長興街宿舍區'?'dorm':''}">${s.area==='長興街宿舍區'?'長興宿舍':'校內'}</span></div>`));if(!filtered.length)box.innerHTML='<div class="empty" style="padding:10px">查無點位</div>'}
document.getElementById('stationSearch').oninput=renderStations;document.getElementById('areaFilter').onchange=renderStations;document.getElementById('fitAll').onclick=()=>map.fitBounds(bounds.pad(.08));document.getElementById('toggleLabels').onclick=e=>{labelsVisible=!labelsVisible;if(labelsVisible){labelLayer.addTo(map);e.target.textContent='隱藏站名'}else{map.removeLayer(labelLayer);e.target.textContent='顯示站名'}};
document.getElementById('summary').textContent=`共 ${stations.length} 站｜臺大校內 ${stations.filter(s=>s.area==='臺大校內').length}｜長興宿舍 ${stations.filter(s=>s.area==='長興街宿舍區').length}`;
renderStations();renderDraft();renderRoutes();setTimeout(()=>map.invalidateSize(),150);window.addEventListener('resize',()=>map.invalidateSize());
</script>
</body>
</html>
